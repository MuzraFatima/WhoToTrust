# AmbiNoise-NLI: 9 methods x 6 settings (3 error types x 2 rates) x 3 seeds = 162 runs (~11 T4-hours).
name: main_nli
fixed: [experiment=main, stage=final, data=ambinoise_nli, data.noise.k=5]
