[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labeltriage"
version = "0.1.0"
description = "Separating annotation error from genuine ambiguity, and training on each differently."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MuzraFatima" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.40", "datasets>=2.18"]
features = ["faiss-cpu>=1.8", "open-clip-torch>=2.24"]
crowd = ["cleanlab>=2.6", "crowd-kit>=1.2"]
tracking = ["wandb>=0.17"]
demo = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["ruff==0.6.9", "pytest>=8", "pytest-cov>=5", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["labeltriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "torch: needs PyTorch installed",
    "slow: longer-running tests",
]
